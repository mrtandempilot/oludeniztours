# MediaMTX — kameradan RTSP çeker, web için HLS olarak yayınlar.
# Kamera adresi (şifreli) BURADA DEĞİL, .env dosyasında: CAMERA_RTSP
logLevel: info

# Sadece HLS açık; diğer protokoller kapalı (dışarıdan yayın basılamaz)
rtsp: no
rtmp: no
srt: no
webrtc: no
api: no

hls: yes
hlsAddress: 127.0.0.1:8888   # dışarı Caddy (HTTPS) üzerinden açılır
hlsVariant: lowLatency
hlsAllowOrigin: '*'

# Herkes sadece izleyebilir; kimse yayın gönderemez
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read

paths:
  cam:
    source: rtsp://placeholder   # docker-compose MTX_PATHS_CAM_SOURCE ile değiştirir
    sourceOnDemand: yes          # izleyen yoksa kameradan veri çekmez (internet kotası korunur)
    sourceOnDemandCloseAfter: 30s
