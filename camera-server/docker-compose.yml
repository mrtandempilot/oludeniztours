services:
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    restart: unless-stopped
    network_mode: host          # Tailscale üzerinden kamera ağına erişmek için
    environment:
      MTX_PATHS_CAM_SOURCE: ${CAMERA_RTSP}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    network_mode: host
    environment:
      CAM_DOMAIN: ${CAM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
